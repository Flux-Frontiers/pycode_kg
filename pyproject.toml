# pyproject.toml — PyCodeKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[viz]"             core + Streamlit/Plotly/PyVis visualizer
#   pip install -e ".[viz3d]"           core + PyVista 3D visualizer
#   pip install -e ".[all]"             everything above
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --with dev --all-extras   everything
#   poetry install --with dev           core + dev tools (pytest, ruff, ty, etc.)
#   poetry install --extras "viz"       core + Streamlit/Plotly visualizer only
#   poetry install --extras "viz3d"     core + 3D visualizer only
#   poetry install                      core runtime only
#
# Dev tooling lives in the Poetry `dev` group, not an extra, so it stays out
# of published wheel metadata. pip-only setups can't install it — use poetry
# for development.
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=pycode_kg          with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pycode_kg", from = "src" }]

# CPU-only torch on Linux: dev/CI here has no GPU, but the default PyPI linux
# wheel bundles the full CUDA runtime (~2.7G of nvidia-* packages, ~700M of
# triton) regardless. "explicit" priority means only packages naming this
# source use it — nothing else is redirected off PyPI. This affects local/CI
# installs only; it is not part of published wheel metadata, so `pip install
# pycode-kg` for a GPU user still resolves torch normally.
#
# Linux only: macOS/Windows torch builds are already CPU/MPS, and this index
# publishes the macOS ones without the "+cpu" local version label, so locking
# it globally leaves those platforms with no installable candidate.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = [
    { markers = "sys_platform == 'linux'", source = "pytorch-cpu" },
    { markers = "sys_platform != 'linux'" },
]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "pycode-kg"
version = "0.24.1"
description = "A tool to build a searchable knowledge graph from Python repositories"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "code-analysis", "ast", "sqlite-vec", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module
    # (FastMCP was split out into the standalone `fastmcp` package) and rebuilt
    # mcp.server around new submodules. src/pycode_kg/mcp_server.py imports
    # FastMCP from mcp, so an unbounded floor lets a clean install pull 2.x and
    # break `pycodekg-mcp` at import time. Lift this only alongside a port to
    # the standalone fastmcp package.
    "mcp>=1.0.0,<2",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rich>=14.3.3,<15",
    "sentence-transformers>=5.4.1",
    # Upper-bounded to keep resolution single-valued across extras: mcp and
    # sse-starlette float to any 1.x, but streamlit (viz extra) caps starlette
    # at <1.4.0. Without this ceiling a bare install resolves 1.6.0 while
    # --extras viz resolves 1.3.1, poetry locks BOTH with no distinguishing
    # markers, and an install can unpack the two wheels over the same
    # starlette/ directory — splicing applications.py into a file matching
    # neither RECORD hash and surfacing as a SyntaxError importing
    # mcp.server.fastmcp. 1.3.1 is also the only version pycodekg-mcp is
    # tested against. Floor matches sse-starlette's own requirement.
    "starlette>=0.49.1,<1.4.0",
    # Core, not optional: kg.py hard-codes vector_backend="sqlite-vec", so every
    # build/query path goes through kg_utils.vector_backend.SqliteVecBackend,
    # which imports sqlite_vec at connect time. Exact pin — sqlite-vec is pre-1.0
    # and breaking minors ship under 0.x; kgmodule-utils pins the same ==0.1.9.
    # Declared here rather than pulled via kgmodule-utils[sqlite-vec] so the
    # requirement is visible in this project's own metadata (doc-kg 0.20.0 does
    # the same).
    "sqlite-vec==0.1.9",
    # Kept direct even though `[semantic]` carries the same `>=2.5.1`: the
    # `[tool.poetry.dependencies]` block above routes linux torch to the CPU-only
    # index, and that enrichment only applies to a dependency this project
    # declares itself. Dropping it here would pull the ~3.4G CUDA wheel back in.
    "torch>=2.5.1",
    # `[semantic]` is safe again as of kgmodule-utils 0.10.0, which moved
    # `lancedb` out into its own `[lancedb]` extra. It now carries numpy, rich,
    # sentence-transformers, sqlite-vec, torch and transformers under the same
    # constraints used here, so `transformers` needs no direct entry.
    # `[viz]` stays off: kg_utils.viz imports pyvis lazily, so it would force
    # pyvis into every bare install when it belongs in this project's own `viz`
    # extra.
    # `[viz3d]` is the shared 3-D layout engine behind `pycode_kg.layout3d`.
    # Its only dependency is numpy, which `[semantic]` already pulls, so it adds
    # nothing to the install — it just declares what layout3d actually imports.
    # Unlike `[viz]`, there is no pyvis to leak into a bare install.
    # Floor is 0.13.x rather than 0.12.1 because that is where SnapshotManager
    # stops writing absolute paths into snapshot JSON. This package ships
    # `pycodekg snapshot save`, and those snapshots get committed to the
    # user's repo — against an older kgmodule-utils the command writes their
    # home directory and username into version control.
    #
    # 0.13.2 specifically, never 0.13.1: that release carried the path fix but
    # also made `repo_root` a read-only property, which breaks every subclass
    # that assigns it. 0.13.2 keeps the fix and restores the plain attribute.
    #
    # 0.15.0 because the `viz3d` extra below needs kg_utils.viz3d.qt, and this
    # repo's own rule is one floor per package — a lower floor here would leave
    # a reader working out which constraint actually binds. Nothing in the core
    # install needs 0.15.0 functionally; it is a superset of 0.14.0.
    #
    # 0.18.1 because resolve_symbols() only reads the receiver_class metadata
    # this repo's visitor writes as of 0.24.1 -- against 0.18.0 the stubs are
    # tagged correctly but the tag is silently ignored, so resolution stays on
    # the old untyped trailing-name match with no error to say so.
    "kgmodule-utils[semantic,viz3d]>=0.18.1",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.14.0",
    "pyvis>=0.3.2",
    "streamlit>=1.56.0",
]
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    # pyvista comes from the SDK, which is what needs it: tree_mesh, leaf_glyphs
    # and smooth_paths live there. The main dependency above stays on plain
    # [viz3d] (numpy only) so the nine repos that take pycode-kg do not acquire
    # VTK for a layout import; rendering stays opt-in, here.
    # Same floor as the core declaration above — one package, one floor, so a
    # reader does not have to work out which constraint actually binds.
    # [viz3d-qt] (new in 0.15.0) adds kg_utils.viz3d.qt — the Qt machinery a
    # viewer needs to cast: the render lifecycle and cast_scene_to_looking_glass,
    # which this module's "Cast to LG" button now drives instead of open-coding
    # the four-step build/render/write/cast itself. It subsumes [viz3d-render]
    # (it declares pyvista too), but both are named so the dependency reads as
    # what it is rather than as a side effect.
    "kgmodule-utils[viz3d-render,viz3d-qt]>=0.18.1",
    "pyvistaqt>=0.11.0",
    "trame-vtk>=2.0.0",
    # Looking Glass quilts. 0.4.0 supplies depth_report() and widened
    # requires-python to <3.14, which retires the old marker gate. 0.6.0 adds
    # QuiltSpec.scaled(), which replaces the tile-grid rounding this repo used
    # to open-code, and save_and_cast_quilt() underneath the SDK cast helper.
    "quiltwright>=0.8.0",
]

# Cross-KG sibling packages (doc-kg, pycode-kg, agent-kg, kg-rag) are NOT
# declared here. They are never imported by this package, and listing them
# forces poetry's universal resolution to reconcile the transformers pin of
# every *published* sibling against this project's own -- a deadlock, since
# doc-kg and pycode-kg each depend on the other. Install them by hand:
#   pip install doc-kg pycode-kg         # both on PyPI
#   pip install agent-kg kg-rag          # both on PyPI as of 2026-07-29
# Union of the user-facing extras: keep this the exact sum of `viz` + `viz3d`
# above, edited in the same commit as either. Two poetry resolver limits force
# the hand-copy shape: a self-referential "pycode-kg[viz,viz3d]" is rejected
# ("listed as a dependency of itself"), and repeating kgmodule-utils[viz3d-render]
# here collides with the viz3d entry ("<empty>" constraint), so bare pyvista
# stands in for it — pyvista>=0.44.0 is that extra's entire payload.
# Dev tooling is deliberately absent: it lives in the Poetry dev group below.
all = [
    "markdown>=3.6",
    "param>=2.0.0",
    "plotly>=5.14.0",
    "PyQt5>=5.15.0",
    "pyvis>=0.3.2",
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
    "quiltwright>=0.8.0",
    "streamlit>=1.56.0",
    "trame-vtk>=2.0.0",
]

# Dev tooling. A group rather than an extra so pytest/ruff/ty/pre-commit stay
# out of the published wheel metadata — `pip install pycode-kg[dev]` was never
# meant to be a thing consumers do. Optional to preserve the contract that a
# bare `poetry install` is core runtime only (same shape as `kg` below).
#
#   poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pdoc = ">=14.0.0"
pre-commit = ">=4.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"
ty = ">=0.0.41"

# Maintainer tooling, not a dependency of this package. `.mcp.json` serves a
# `dockg` MCP server from `.venv/bin/dockg`, so the CLI has to be in this repo's
# environment — but nothing under src/ imports doc_kg, and declaring it as a real
# dependency would put it in the published wheel for every consumer.
#
# A Poetry group is the right shape: it is locked and installable but never
# written into wheel metadata, so `pip install pycode-kg` is unaffected.
#
#   poetry install --with kg      # gets the dockg CLI into .venv/bin
#   poetry install                # default — the group is optional, skipped
#
# `kg` is the fleet-wide name for this group so there is one command to remember;
# contents are per-repo and minimal, covering only what that repo actually
# invokes. Safe to lock because doc-kg keeps its own pycode-kg in a group too, so
# the published metadata on either side has no cycle for the resolver to chase.
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.22.0"

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/pycode_kg"
Repository = "https://github.com/Flux-Frontiers/pycode_kg"

[project.scripts]
# The convenience aliases (`pycodekg-analyze`, `pycodekg-build`, ...) went in
# 0.23.0: nothing invoked them. `pycodekg-mcp` stays -- the documented Claude
# Desktop and Copilot configs put that path in users' config files, so dropping
# it would break their MCP server on upgrade.
pycodekg     = "pycode_kg.cli.main:cli"
pycodekg-mcp = "pycode_kg.mcp_server:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# Vendored agent scratch dirs (Claude Code skills, Codex) — not project code.
# The pre-commit hook's exclude can't cover these (it runs with
# pass_filenames: false), so the exclusion must live here.
extend-exclude = [".claude", ".agents", ".codex", "*.md"]
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview), so `ruff format --check .` starts rewriting
# prose docs the moment the lock resolves 0.16 — a failure that looks unrelated
# to whatever change triggered the relock. Doc snippets are illustrative and
# often deliberately aligned, so keep them out of the formatter's reach.
# doc_kg and ftree_kg carry the same exclusion.

[tool.ruff.lint]
# B023, BLE001, PLC0415 replace the retired pylint hook's cell-var-from-loop,
# broad-exception-caught, and import-outside-toplevel checks.
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# viz3d is GUI code full of deliberate lazy imports (optional Qt/pyvista deps).
"src/pycode_kg/viz3d.py" = ["PLC0415"]
# Test imports are often deliberately lazy — they must run after sys.modules
# mocks are installed.
"tests/**" = ["PLC0415"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# viz3d.py carries `# ty: ignore` suppressions for param/PyQt5/pyvista false
# positives. Those libraries live in the optional viz/viz3d extras, so in the
# lean CI install the imports are Unknown, the errors don't fire, and the
# ignores look "unused". Don't fail the build on that — the suppressions are
# still honored locally where the extras (and the errors) are present.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src"]

[tool.dockg]
exclude = [
    ".dockg", ".pycodekg", ".git", ".mypy_cache", ".pytest_cache", ".venv",
    "__pycache__", "bundles", "dist", "src", "venv",
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png pycode_kg" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"

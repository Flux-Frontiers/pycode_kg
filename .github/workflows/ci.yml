name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dev dependencies
        run: poetry install --no-interaction --with dev

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-extras-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # The embedding model the `integration` suite loads. sentence-transformers
      # and torch already arrive as core dependencies via kgmodule-utils[semantic],
      # so the model weights are the only thing standing between CI and those
      # tests. ~130 MB, downloaded once and then restored from cache; keyed on the
      # model name so a model change re-downloads rather than reusing the wrong one.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.kgrag/models
          key: kgrag-models-${{ runner.os }}-bge-small-en-v1.5

      # viz and viz3d, so the suites gated on pyvis/plotly/pyvista run instead
      # of skipping — without them the Test job silently drops those modules.
      - name: Install dependencies
        run: poetry install --no-interaction --with dev --extras "viz viz3d"

      # No `-m "not integration"`. The marker was hiding fourteen end-to-end
      # tests of the real embedder, index and pipeline behind a deselect, on the
      # assumption they were too slow for CI; they run in about four seconds
      # once the model is cached, and they cover the path a unit test cannot.
      - name: Run tests
        run: poetry run pytest

  wheel:
    name: Installed CLI
    runs-on: ubuntu-latest
    # Guards the one thing the other jobs structurally cannot see. lint,
    # type-check and test all run against the source tree with
    # pythonpath = ["src"], so they pass even when the built wheel is missing
    # modules the CLI imports, or when a dependency is declared in a form PyPI
    # strips from wheel metadata. ia-kg 0.1.0 shipped exactly that way: green
    # CI, and every console script dead on `pip install`.
    #
    # This builds the artifact users actually receive, installs it somewhere
    # with no source tree in sight, and loads every console-script entry point.
    # entry_point.load() imports the module and resolves the attribute without
    # calling it -- so an MCP server entry point is verified, not started.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build wheel
        run: poetry build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl

      - name: Load every console-script entry point
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import sys

          eps = [e for e in md.distribution("pycode-kg").entry_points
                 if e.group == "console_scripts"]
          if not eps:
              sys.exit("no console scripts found in the installed distribution")

          failed = []
          for e in sorted(eps, key=lambda e: e.name):
              try:
                  e.load()
                  print(f"  ok    {e.name} -> {e.value}")
              except Exception as exc:
                  failed.append(e.name)
                  print(f"  FAIL  {e.name} -> {e.value}\n        {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"\n{len(failed)} console script(s) unusable when installed: "
                       + ", ".join(failed))
          print(f"\nall {len(eps)} console scripts load from a clean install")
          PY
